<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实时风控告警大屏</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/echarts.min.js"></script>
</head>
<body>
  <header>
    <h1>实时风控告警大屏</h1>
    <div class="sub">PyFlink 动态规则 · Kafka · Doris · Flink CEP · Broadcast State 热更新</div>
    <div class="updated" id="updated">--:--:--</div>
  </header>

  <section class="cards" id="cards">
    <div class="card"><div class="num" id="c-total">-</div><div class="label">累计告警数</div></div>
    <div class="card"><div class="num" id="c-5m">-</div><div class="label">近 5 分钟告警</div></div>
    <div class="card"><div class="num" id="c-1h">-</div><div class="label">近 1 小时告警</div></div>
    <div class="card"><div class="num" id="c-rules">-</div><div class="label">生效规则数</div></div>
  </section>

  <section class="charts">
    <div class="panel">
      <h2>规则管理（热更新，无需重启作业）</h2>
      <div class="rule-form">
        <label>阈值(元)<input type="number" id="r-threshold" value="900" min="1" step="50"></label>
        <label>窗口(秒)<input type="number" id="r-window" value="30" min="1" max="120"></label>
        <label>规则名<input type="text" id="r-name" value="连续大额交易"></label>
        <label>启用<input type="checkbox" id="r-enabled" checked></label>
        <div class="rule-btns">
          <button id="btn-apply" class="primary">更新规则</button>
          <button id="btn-disable">停用</button>
          <button id="btn-enable">启用</button>
        </div>
      </div>
      <div class="rule-status" id="rule-status">当前规则：-</div>
    </div>
    <div class="panel">
      <h2>告警端到端延迟（近 30 分钟）</h2>
      <div class="latency-stats" id="latency-stats">均值 - | P50 - | P95 - | P99 -</div>
      <div id="chart-latency" class="chart"></div>
    </div>
  </section>

  <section class="charts">
    <div class="panel">
      <h2>告警趋势（近 30 分钟）</h2>
      <div id="chart-trend" class="chart"></div>
    </div>
    <div class="panel">
      <h2>告警城市分布</h2>
      <div id="chart-city" class="chart"></div>
    </div>
  </section>

  <section class="charts">
    <div class="panel">
      <h2>规则触发排行</h2>
      <div id="chart-rules" class="chart"></div>
    </div>
    <div class="panel">
      <h2>最新告警</h2>
      <table id="alert-table">
        <thead>
          <tr><th>时间</th><th>规则</th><th>用户</th><th>金额(元)</th><th>风险分</th><th>城市</th><th>详情</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
